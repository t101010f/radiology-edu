<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem('lang') === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    } catch (e) {}
  </script>
</head>

      <div class="nav-end">
        <button class="circle-btn lang" id="lang-btn" type="button" aria-label="Switch to English">EN</button>
        <button class="circle-btn" id="theme-btn" type="button" aria-label="تبديل المظهر"></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>
