<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Time, distance and shielding">
<defs>
<radialGradient id="bgg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0f1c23"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b45c" stop-opacity=".75"/><stop offset="1" stop-color="#f0b45c" stop-opacity=".08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fc3d9"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bgg)"/><rect width="640" height="360" fill="url(#grid)"/>
<g transform="translate(60 180)"><circle cx="0" cy="0" r="16" fill="#f0b45c" filter="url(#glow)"/></g><circle cx="60" cy="180" r="50" fill="none" stroke="#f0b45c" stroke-opacity="0.5"/><circle cx="60" cy="180" r="100" fill="none" stroke="#f0b45c" stroke-opacity="0.4"/><circle cx="60" cy="180" r="150" fill="none" stroke="#f0b45c" stroke-opacity="0.3"/><circle cx="60" cy="180" r="200" fill="none" stroke="#f0b45c" stroke-opacity="0.19999999999999996"/><circle cx="180" cy="154" r="13" fill="#f2877f"/><rect x="166" y="170" width="28" height="52" rx="12" fill="#f2877f"/><circle cx="330" cy="154" r="13" fill="#f0b45c"/><rect x="316" y="170" width="28" height="52" rx="12" fill="#f0b45c"/><rect x="440" y="110" width="16" height="130" rx="3" fill="#8fb3c0"/><circle cx="520" cy="154" r="13" fill="#6fcf97"/><rect x="506" y="170" width="28" height="52" rx="12" fill="#6fcf97"/><text x="180" y="260" font-family="Menlo, Consolas, monospace" font-size="16" fill="#8fb3c0" text-anchor="middle">1 m · 100%</text><text x="330" y="260" font-family="Menlo, Consolas, monospace" font-size="16" fill="#8fb3c0" text-anchor="middle">2 m · 25%</text><text x="520" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Behind barrier</text><text x="180" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Close</text><text x="330" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Double distance</text><text x="500" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Lead barrier</text><text x="448" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Barrier</text>
</svg>