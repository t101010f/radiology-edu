<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Staff protective equipment">
<defs>
<radialGradient id="bgg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0f1c23"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b45c" stop-opacity=".75"/><stop offset="1" stop-color="#f0b45c" stop-opacity=".08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fc3d9"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bgg)"/><rect width="640" height="360" fill="url(#grid)"/>
<rect x="20" y="90" width="140" height="150" rx="12" fill="#1f323c" stroke="#6fc3d9" stroke-width="1.5"/><g transform="translate(90,148)"><path d="M-24 -38h48l10 70h-68z" fill="#8fb3c0"/><path d="M-24 -38q24 18 48 0" fill="none" stroke="#0f1c23" stroke-width="3"/></g><text x="90" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfe3ea" text-anchor="middle" direction="ltr">Lead apron</text><text x="90" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fb3c0" text-anchor="middle" direction="ltr">Protects the torso</text><rect x="175" y="90" width="140" height="150" rx="12" fill="#1f323c" stroke="#6fc3d9" stroke-width="1.5"/><g transform="translate(245,148)"><path d="M-34 -6q34 30 68 0v14q-34 30-68 0z" fill="#8fb3c0"/></g><text x="245" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfe3ea" text-anchor="middle" direction="ltr">Thyroid shield</text><text x="245" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fb3c0" text-anchor="middle" direction="ltr">Protects the thyroid</text><rect x="330" y="90" width="140" height="150" rx="12" fill="#1f323c" stroke="#6fc3d9" stroke-width="1.5"/><g transform="translate(400,148)"><circle cx="-18" cy="0" r="14" fill="none" stroke="#8fb3c0" stroke-width="5"/><circle cx="18" cy="0" r="14" fill="none" stroke="#8fb3c0" stroke-width="5"/><path d="M-4 0h8" stroke="#8fb3c0" stroke-width="4"/></g><text x="400" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfe3ea" text-anchor="middle" direction="ltr">Lead glasses</text><text x="400" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fb3c0" text-anchor="middle" direction="ltr">Protects the eye lens</text><rect x="485" y="90" width="140" height="150" rx="12" fill="#1f323c" stroke="#f0b45c" stroke-width="1.5"/><g transform="translate(555,148)"><rect x="-18" y="-28" width="36" height="50" rx="5" fill="#8fb3c0"/><circle cx="0" cy="-2" r="9" fill="#f0b45c"/><rect x="-6" y="-38" width="12" height="12" rx="2" fill="none" stroke="#8fb3c0" stroke-width="3"/></g><text x="555" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfe3ea" text-anchor="middle" direction="ltr">Dosimeter</text><text x="555" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fb3c0" text-anchor="middle" direction="ltr">Always worn</text><text x="320" y="55" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#cfe3ea" text-anchor="middle" direction="ltr">Personal protective equipment in radiology</text>
</svg>