<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Becquerel's experiment">
<defs>
<radialGradient id="bgg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0f1c23"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b45c" stop-opacity=".75"/><stop offset="1" stop-color="#f0b45c" stop-opacity=".08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fc3d9"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bgg)"/><rect width="640" height="360" fill="url(#grid)"/>
<rect x="170" y="150" width="300" height="150" rx="6" fill="#20313a" stroke="#8fb3c0" stroke-width="2"/><ellipse cx="320" cy="225" rx="70" ry="40" fill="#05090b" filter="url(#soft)" opacity=".85"/><rect x="280" y="110" width="80" height="50" rx="4" fill="#6fcf97" fill-opacity=".7"/><path d="M300 160L290 200" stroke="#f0b45c" stroke-opacity=".7" stroke-width="2"/><path d="M310 160L304 200" stroke="#f0b45c" stroke-opacity=".7" stroke-width="2"/><path d="M320 160L318 200" stroke="#f0b45c" stroke-opacity=".7" stroke-width="2"/><path d="M330 160L332 200" stroke="#f0b45c" stroke-opacity=".7" stroke-width="2"/><path d="M340 160L346 200" stroke="#f0b45c" stroke-opacity=".7" stroke-width="2"/><circle cx="360" cy="125" r="3.5" fill="#6fc3d9"/><path d="M360 125L480 80" stroke="#6fc3d9" stroke-width="1.2" stroke-opacity=".8"/><text x="480" y="74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Uranium salts</text><circle cx="470" cy="270" r="3.5" fill="#6fc3d9"/><path d="M470 270L540 300" stroke="#6fc3d9" stroke-width="1.2" stroke-opacity=".8"/><text x="540" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Wrapped photo plate</text><circle cx="260" cy="225" r="3.5" fill="#6fc3d9"/><path d="M260 225L120 260" stroke="#6fc3d9" stroke-width="1.2" stroke-opacity=".8"/><text x="120" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Radiation mark</text>
