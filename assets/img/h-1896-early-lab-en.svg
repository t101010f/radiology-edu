<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Early X-ray tube without protection">
<defs>
<radialGradient id="bgg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0f1c23"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b45c" stop-opacity=".75"/><stop offset="1" stop-color="#f0b45c" stop-opacity=".08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fc3d9"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bgg)"/><rect width="640" height="360" fill="url(#grid)"/>
<ellipse cx="320" cy="170" rx="150" ry="60" fill="#6fc3d9" fill-opacity=".12" stroke="#e3ecef" stroke-width="2.5"/><path d="M170 170H120M470 170H520" stroke="#e3ecef" stroke-width="5"/><rect x="190" y="150" width="14" height="40" fill="#8fb3c0"/><path d="M410 140L440 170L410 200z" fill="#8fb3c0"/><ellipse cx="320" cy="170" rx="120" ry="40" fill="#6fcf97" fill-opacity=".18" filter="url(#glow)"/><path d="M320 230L250 320H390z" fill="url(#beam)"/><path d="M300 260h40v50h-40z" fill="none" stroke="#f2877f" stroke-width="2" stroke-dasharray="4 4"/><circle cx="400" cy="290" r="3.5" fill="#6fc3d9"/><path d="M400 290L480 300" stroke="#6fc3d9" stroke-width="1.2" stroke-opacity=".8"/><text x="480" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">No apron, barrier or dosimeter</text><text x="320" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Late 19th century</text>
</svg>