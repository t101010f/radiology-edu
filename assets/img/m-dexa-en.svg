<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Bone densitometry">
<defs>
<radialGradient id="bgg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0f1c23"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b45c" stop-opacity=".75"/><stop offset="1" stop-color="#f0b45c" stop-opacity=".08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fc3d9"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bgg)"/><rect width="640" height="360" fill="url(#grid)"/>
<rect x="80" y="220" width="460" height="16" rx="4" fill="#e3ecef" fill-opacity=".85"/><rect x="440" y="236" width="30" height="80" fill="#1f323c"/><g><circle cx="110" cy="202" r="17" fill="#2c4350" stroke="#8fb3c0" stroke-width="1.5"/><rect x="130" y="186" width="330" height="32" rx="16" fill="#2c4350" stroke="#8fb3c0" stroke-width="1.5"/></g><path d="M300 100V60H480V250" fill="none" stroke="#e3ecef" stroke-width="12" stroke-linecap="round"/><rect x="270" y="100" width="60" height="26" rx="6" fill="#1f323c" stroke="#e3ecef" stroke-width="2"/><path d="M300 126V190" stroke="#f0b45c" stroke-width="3" stroke-dasharray="4 4"/><path d="M290 126V190" stroke="#6fc3d9" stroke-width="3" stroke-dasharray="4 4"/><circle cx="300" cy="113" r="3.5" fill="#6fc3d9"/><path d="M300 113L170 70" stroke="#6fc3d9" stroke-width="1.2" stroke-opacity=".8"/><text x="170" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Two energy beams</text><path d="M260 150H360" stroke="#6fc3d9" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><g transform="translate(560 150)"><rect x="-50" y="-40" width="100" height="80" rx="8" fill="#071015" stroke="#8fb3c0"/><text x="0" y="-12" font-family="Menlo, Consolas, monospace" font-size="15" fill="#8fb3c0" text-anchor="middle">T-score</text><text x="0" y="18" font-family="Menlo, Consolas, monospace" font-size="22" fill="#f0b45c" text-anchor="middle">−1.8</text></g>
</svg>