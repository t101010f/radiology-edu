<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Pregnancy and imaging">
<defs>
<radialGradient id="bgg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0f1c23"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b45c" stop-opacity=".75"/><stop offset="1" stop-color="#f0b45c" stop-opacity=".08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fc3d9"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bgg)"/><rect width="640" height="360" fill="url(#grid)"/>
<rect x="230" y="30" width="180" height="62" rx="12" fill="#f0b45c" fill-opacity=".2" stroke="#f0b45c" stroke-width="2"/><text x="320" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#f0b45c" text-anchor="middle" direction="ltr">Pregnant?</text><text x="320" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Tell the staff first</text><path d="M320 94C320 140 95 140 95 186" fill="none" stroke="#6fc3d9" stroke-width="2" marker-end="url(#arr)"/><path d="M320 94C320 140 245 140 245 186" fill="none" stroke="#6fc3d9" stroke-width="2" marker-end="url(#arr)"/><path d="M320 94C320 140 395 140 395 186" fill="none" stroke="#6fc3d9" stroke-width="2" marker-end="url(#arr)"/><path d="M320 94C320 140 545 140 545 186" fill="none" stroke="#6fc3d9" stroke-width="2" marker-end="url(#arr)"/><rect x="30" y="190" width="130" height="54" rx="10" fill="#1f323c" stroke="#6fcf97" stroke-width="2"/><text x="95" y="223" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Radiation-free</text><rect x="180" y="190" width="130" height="54" rx="10" fill="#1f323c" stroke="#6fc3d9" stroke-width="2"/><text x="245" y="223" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Adjust dose</text><rect x="330" y="190" width="130" height="54" rx="10" fill="#1f323c" stroke="#6fc3d9" stroke-width="2"/><text x="395" y="223" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Not abdominal</text><rect x="480" y="190" width="130" height="54" rx="10" fill="#1f323c" stroke="#6fc3d9" stroke-width="2"/><text x="545" y="223" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cfe3ea" text-anchor="middle" direction="ltr">Postpone</text><text x="95" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Ultrasound/MRI</text><text x="245" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Lowest dose</text><text x="395" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Tiny fetal dose</text><text x="545" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8fb3c0" text-anchor="middle" direction="ltr">Doctor decides</text>
</svg>